<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValoBalance</title>
  <meta name="description" content="Finnish imbalance price forecast for the next 10 hours: price range, exceptional price risk, regulation direction, drivers and alerts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233987e5'/%3E%3Cstop offset='1' stop-color='%239085e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M18 5L9 18h6l-2 9 10-14h-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/echarts.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2L5 14h5.5L9 22l10-13h-5.5z" fill="#fff"/></svg></div>
      <div><h1>Valo<span>Balance</span></h1><small>Finland · next 10 hours · Finnish time</small></div>
    </div>
    <div class="timebar" id="timebar">
      <div class="tb-main">
        <div class="seg-btns">
          <button data-shift="-24" title="One day earlier (Shift + ←)">«<span>1d</span></button>
          <button data-shift="-1" title="One hour earlier (←)">‹<span>1h</span></button>
        </div>
        <div class="origin" title="Forecast made at this time. Every view shows only what was known then.">
          <span id="origin-day">…</span>
          <strong id="origin-time">…</strong>
        </div>
        <div class="seg-btns">
          <button data-shift="1" title="One hour later (→)"><span>1h</span>›</button>
          <button data-shift="24" title="One day later (Shift + →)"><span>1d</span>»</button>
        </div>
        <button class="mini" id="next-alert" title="Jump to the next time with spike risk in the coming hour (N, Shift + N for the previous one)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 15.5H3z"/><path d="M12 10v4.5"/><circle cx="12" cy="16.8" r=".5" fill="currentColor"/></svg><span>Next alert</span></button>
        <div class="replay">
          <button class="play" id="play" title="Replay: step the forecast time forward hour by hour (Space)">▶ Replay</button>
          <button class="speed" id="speed" title="Replay speed">1×</button>
        </div>
      </div>
      <div class="tb-slider">
        <span id="range-start"></span>
        <div class="scrub" title="Times with spike risk in the coming hour: red = above spot, purple = below spot. The mark divides validation from test">
          <canvas id="ribbon" aria-hidden="true"></canvas>
          <input type="range" id="origin-slider" min="0" max="0" value="0" aria-label="Forecast time">
        </div>
        <span id="range-end"></span>
      </div>
    </div>
    <div class="settings">
      <select id="dataset" aria-label="Data set"></select>
      <button class="round" id="theme" title="Light or dark (T)" aria-label="Switch between light and dark">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2z"/></svg>
      </button>
    </div>
  </header>

  <div class="subbar">
    <nav class="tabs" id="tabs">
      <button data-view="now" class="on" title="Now (1)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8.5"/></svg>Now</button>
      <button data-view="next" title="Next 10 h (2)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5.5-6 4 3.5L20 6"/><path d="M14.5 6H20v5.5"/></svg>Next 10 h</button>
      <button data-view="hindsight" title="Hindsight (3)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5V9h4.5"/><path d="M12 8v4.5l3 1.8"/></svg>Hindsight</button>
      <button data-view="run" title="Run a forecast (4)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>Run a forecast</button>
      <button data-view="about" title="About & API (5)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg>About &amp; API</button>
    </nav>
    <div class="chips-line" id="freshness"></div>
  </div>

  <main id="view"></main>

  <footer>
    <div class="keys"><span><kbd>←</kbd><kbd>→</kbd> 1 h</span><span><kbd>Shift</kbd> + <kbd>←</kbd><kbd>→</kbd> 1 day</span><span><kbd>Space</kbd> replay</span><span><kbd>N</kbd> next alert</span><span><kbd>1</kbd>–<kbd>5</kbd> views</span><span><kbd>T</kbd> theme</span></div>
    <div>Alerts are suggestions to review, never trading or operating instructions · Contains data from Fingrid Open Data and the ENTSO-E Transparency Platform (CC BY 4.0)</div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
