<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValoBalance</title>
  <meta name="description" content="Finnish imbalance price forecast for the next 10 hours: price range, exceptional price risk, regulation direction, drivers and alerts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233987e5'/%3E%3Cstop offset='1' stop-color='%239085e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M18 5L9 18h6l-2 9 10-14h-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/echarts.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2L5 14h5.5L9 22l10-13h-5.5z" fill="#fff"/></svg></div>
      <div><h1>ValoBalance</h1><small>Finland · next 10 hours · Finnish time</small></div>
    </div>
    <div class="timebar" id="timebar">
      <div class="tb-main">
        <div class="seg-btns">
          <button data-shift="-24" title="One day earlier (Shift + ←)">«<span>1d</span></button>
          <button data-shift="-1" title="One hour earlier (←)">‹<span>1h</span></button>
        </div>
        <div class="origin" title="Forecast made at this time. Every view shows only what was known then.">
          <span id="origin-day">…</span>
          <strong id="origin-time">…</strong>
        </div>
        <div class="seg-btns">
          <button data-shift="1" title="One hour later (→)"><span>1h</span>›</button>
          <button data-shift="24" title="One day later (Shift + →)"><span>1d</span>»</button>
        </div>
        <button class="play" id="play" title="Replay: step the forecast time forward one hour per second">▶ Replay</button>
      </div>
      <div class="tb-slider">
        <span id="range-start"></span>
        <input type="range" id="origin-slider" min="0" max="0" value="0" aria-label="Forecast time">
        <span id="range-end"></span>
      </div>
    </div>
    <div class="settings">
      <select id="dataset" aria-label="Data set"></select>
      <button class="round" id="theme" title="Light or dark">◐</button>
    </div>
  </header>

  <div class="subbar">
    <nav class="tabs" id="tabs">
      <button data-view="now" class="on"><span>◉</span>Now</button>
      <button data-view="next"><span>↗</span>Next 10 h</button>
      <button data-view="hindsight"><span>↺</span>Hindsight</button>
      <button data-view="run"><span>⇪</span>Run a forecast</button>
      <button data-view="about"><span>ⓘ</span>About &amp; API</button>
    </nav>
    <div class="chips-line" id="freshness"></div>
  </div>

  <main id="view"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
